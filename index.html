<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ПИШТИРТУ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e11;
    --surface: #18181d;
    --surface2: #22222a;
    --border: #2e2e38;
    --accent: #e91e63;
    --accent2: #2563eb;
    --text: #f0f0f5;
    --muted: #7a7a8c;
    --green: #22c55e;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .logo span { color: var(--accent); }

  .tagline { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 57px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .sec-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field label { font-size: 12px; font-weight: 600; color: var(--text); }

  .field .hint { font-size: 10px; color: var(--muted); }

  select, input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }

  select:focus, input[type="text"]:focus { border-color: var(--accent); }

  .rng-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .rng-label { font-size: 12px; font-weight: 600; }

  .rng-val {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent);
  }

  .divider { height: 1px; background: var(--border); }

  .btn {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: 0.85; }
  .btn-upload { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
  .btn-process { background: var(--accent2); color: #fff; }

  .file-status {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'Space Mono', monospace;
  }

  .file-status.ok { color: var(--green); }

  /* ── MAIN ── */
  .main {
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
  }

  /* ── PREVIEW AREA ── */
  .preview-area {
    position: relative;
    overflow: hidden;
    background: #090909;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* оригинал — размытый фон */
  #bgBlur {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(20px) brightness(0.3);
    transform: scale(1.1);
    display: none;
  }

  /* canvas превью */
  #previewCanvas {
    position: relative;
    z-index: 1;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  /* overlay рамка кропа на оригинале */
  #cropOverlay {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    display: none;
  }

  .crop-border {
    position: absolute;
    inset: 0;
    border: 2px solid var(--accent);
    border-radius: 2px;
  }

  .crop-corner {
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--accent);
    border-style: solid;
  }

  .crop-corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .crop-corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .crop-corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .crop-corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  /* затемнение вне кропа */
  .dim-top, .dim-bottom, .dim-left, .dim-right {
    position: absolute;
    background: rgba(0,0,0,0.55);
    z-index: 1;
    pointer-events: none;
  }

  .empty-hint {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    z-index: 2;
    pointer-events: none;
  }

  .empty-hint .big { font-size: 36px; margin-bottom: 8px; }

  /* ── RESULTS STRIP ── */
  .results-strip {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 16px;
    display: none;
    gap: 10px;
    flex-direction: column;
    max-height: 240px;
    overflow-y: auto;
  }

  .results-strip.visible { display: flex; }

  .strip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .strip-title { font-size: 13px; font-weight: 700; }

  .cards-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .card {
    flex-shrink: 0;
    width: 140px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .card-img {
    width: 140px;
    height: 105px;
    object-fit: cover;
    display: block;
    background: var(--bg);
  }

  .card-img.portrait { height: 187px; }

  .card-foot {
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .card-name {
    font-size: 10px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-dl {
    display: block;
    text-align: center;
    padding: 5px;
    background: var(--border);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s;
  }

  .card-dl:hover { background: var(--accent); color: #fff; }

  .spinner-wrap {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">ПИШ<span>ТИРТУ</span></div>
  <div class="tagline">обрезка скриншотов</div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>
      <div class="sec-label">Файлы</div>
      <button class="btn btn-upload" id="uploadBtn">📂 Выбрать файлы</button>
      <div class="file-status" id="fileStatus" style="margin-top:6px">Нет файлов</div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="sec-label">Формат</div>
      <div class="field">
        <label>Соотношение</label>
        <select id="formatSel">
          <option value="4:3">4:3 (альбомный)</option>
          <option value="3:4">3:4 (портретный)</option>
        </select>
      </div>
    </div>

    <div>
      <div class="sec-label">Разрешение</div>
      <div class="field">
        <label>Размер вывода</label>
        <select id="sizeSel">
          <option value="auto">Авто</option>
          <option value="720">720</option>
          <option value="810">810</option>
          <option value="900">900</option>
          <option value="1080">1080</option>
          <option value="1440">1440</option>
        </select>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="sec-label">Кадрирование</div>

      <div style="margin-bottom:12px">
        <div class="rng-row">
          <span class="rng-label">Смещение</span>
          <span class="rng-val" id="offsetVal">200</span>
        </div>
        <div class="field"><span class="hint">центр = 200</span></div>
        <input type="range" id="offsetRange" min="0" max="400" value="200"/>
      </div>

      <div>
        <div class="rng-row">
          <span class="rng-label">Приближение</span>
          <span class="rng-val" id="zoomVal">100%</span>
        </div>
        <input type="range" id="zoomRange" min="100" max="200" value="100"/>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="sec-label">Имя файлов</div>
      <div class="field">
        <label>Шаблон</label>
        <input type="text" id="nameInput" placeholder="foto → foto_1.jpg"/>
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn btn-process" id="processBtn" disabled>⚙️ Обработать всё</button>

    <!-- Навигация превью -->
    <div id="previewNav" style="display:none; display:none">
      <div class="rng-row" style="margin-top:0">
        <span class="rng-label" style="font-size:11px;color:var(--muted)">Превью файла</span>
        <span class="rng-val" id="previewIdx" style="color:var(--muted)">1 / 1</span>
      </div>
      <input type="range" id="previewRange" min="0" max="0" value="0"/>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="main">

    <input type="file" id="fileInput" accept="image/*" multiple/>

    <!-- Зона превью -->
    <div class="preview-area" id="previewArea">
      <img id="bgBlur" src="" alt=""/>

      <!-- Затемнение снаружи кропа -->
      <div class="dim-top"    id="dimTop"></div>
      <div class="dim-bottom" id="dimBottom"></div>
      <div class="dim-left"   id="dimLeft"></div>
      <div class="dim-right"  id="dimRight"></div>

      <!-- Рамка кропа -->
      <div id="cropOverlay">
        <div class="crop-border"></div>
        <div class="crop-corner tl"></div>
        <div class="crop-corner tr"></div>
        <div class="crop-corner bl"></div>
        <div class="crop-corner br"></div>
      </div>

      <!-- Итоговый кадр -->
      <canvas id="previewCanvas"></canvas>

      <div class="empty-hint" id="emptyHint">
        <div class="big">🖼️</div>
        Загрузите изображения
      </div>
    </div>

    <!-- Результаты -->
    <div class="results-strip" id="resultsStrip">
      <div class="strip-header">
        <span class="strip-title" id="stripTitle">Результаты</span>
        <div class="spinner-wrap" id="spinnerWrap">
          <div class="spinner"></div> Обрабатываю...
        </div>
      </div>
      <div class="cards-row" id="cardsRow"></div>
    </div>

  </div>
</div>

<script>
// ── Элементы ──
const fileInput    = document.getElementById('fileInput');
const uploadBtn    = document.getElementById('uploadBtn');
const fileStatus   = document.getElementById('fileStatus');
const formatSel    = document.getElementById('formatSel');
const sizeSel      = document.getElementById('sizeSel');
const offsetRange  = document.getElementById('offsetRange');
const zoomRange    = document.getElementById('zoomRange');
const offsetVal    = document.getElementById('offsetVal');
const zoomVal      = document.getElementById('zoomVal');
const nameInput    = document.getElementById('nameInput');
const processBtn   = document.getElementById('processBtn');
const previewNav   = document.getElementById('previewNav');
const previewRange = document.getElementById('previewRange');
const previewIdx   = document.getElementById('previewIdx');
const previewArea  = document.getElementById('previewArea');
const previewCanvas= document.getElementById('previewCanvas');
const bgBlur       = document.getElementById('bgBlur');
const cropOverlay  = document.getElementById('cropOverlay');
const emptyHint    = document.getElementById('emptyHint');
const resultsStrip = document.getElementById('resultsStrip');
const stripTitle   = document.getElementById('stripTitle');
const spinnerWrap  = document.getElementById('spinnerWrap');
const cardsRow     = document.getElementById('cardsRow');
const dimTop       = document.getElementById('dimTop');
const dimBottom    = document.getElementById('dimBottom');
const dimLeft      = document.getElementById('dimLeft');
const dimRight     = document.getElementById('dimRight');

let files = [];
let loadedImgs = []; // HTMLImageElement[]
let currentIdx = 0;

// ── Upload ──
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', function() {
  if (!this.files.length) return;
  handleFiles(Array.from(this.files));
  this.value = '';
});

function handleFiles(list) {
  files = list.filter(f => f.type.startsWith('image/'));
  if (!files.length) return;

  fileStatus.textContent = 'Загружено: ' + files.length + ' шт.';
  fileStatus.className = 'file-status ok';
  processBtn.disabled = false;

  if (files.length > 1) {
    previewNav.style.display = 'block';
    previewRange.max = files.length - 1;
    previewRange.value = 0;
  } else {
    previewNav.style.display = 'none';
  }

  loadedImgs = [];
  currentIdx = 0;

  // Загружаем все картинки
  let loaded = 0;
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        loadedImgs[i] = img;
        loaded++;
        if (loaded === files.length) {
          showPreview(0);
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── Навигация по файлам ──
previewRange.addEventListener('input', () => {
  currentIdx = parseInt(previewRange.value);
  previewIdx.textContent = (currentIdx + 1) + ' / ' + files.length;
  showPreview(currentIdx);
});

// ── Слайдеры → моментальный ре-рендер ──
offsetRange.addEventListener('input', () => {
  offsetVal.textContent = offsetRange.value;
  showPreview(currentIdx);
});
zoomRange.addEventListener('input', () => {
  zoomVal.textContent = zoomRange.value + '%';
  showPreview(currentIdx);
});
formatSel.addEventListener('change', () => showPreview(currentIdx));
sizeSel.addEventListener('change',   () => showPreview(currentIdx));

// ── Превью ──
function showPreview(idx) {
  const img = loadedImgs[idx];
  if (!img) return;

  emptyHint.style.display = 'none';
  bgBlur.style.display = 'block';
  bgBlur.src = img.src;

  const mode   = formatSel.value;
  const offset = parseInt(offsetRange.value);
  const zoom   = parseInt(zoomRange.value) / 100;

  const ratio = mode === '4:3' ? 4/3 : 3/4;
  const W = img.naturalWidth, H = img.naturalHeight;

  // Обрезаем края
  const c0 = mk(W, H);
  c0.getContext('2d').drawImage(img, 0, 0);
  const px = c0.getContext('2d').getImageData(0, 0, W, H).data;
  const { top: et, bottom: eb } = smartCropEdges(px, W, H);
  const H2 = Math.max(1, eb - et);

  // Кроп координаты
  const [cx, cy, cw, ch] = cropControl(W, H2, ratio, offset);
  // Zoom
  const [zx, zy, zw, zh] = zoomCoords(cw, ch, zoom);

  // Рисуем результат в previewCanvas
  const areaW = previewArea.clientWidth;
  const areaH = previewArea.clientHeight;
  const outRatio = mode === '4:3' ? 4/3 : 3/4;

  let dispW, dispH;
  if (areaW / areaH > outRatio) {
    dispH = Math.floor(areaH * 0.92);
    dispW = Math.floor(dispH * outRatio);
  } else {
    dispW = Math.floor(areaW * 0.92);
    dispH = Math.floor(dispW / outRatio);
  }

  previewCanvas.width  = dispW;
  previewCanvas.height = dispH;
  previewCanvas.style.width  = dispW + 'px';
  previewCanvas.style.height = dispH + 'px';

  // Рисуем обрезанное изображение
  const c2 = mk(W, H2);
  c2.getContext('2d').drawImage(c0, 0, -et);

  previewCanvas.getContext('2d').drawImage(c2, cx+zx, cy+zy, zw, zh, 0, 0, dispW, dispH);
}

// ── Обработка всех файлов ──
processBtn.addEventListener('click', function() {
  if (!files.length) return;

  processBtn.disabled = true;
  processBtn.textContent = '⏳ Обрабатываю...';
  spinnerWrap.style.display = 'flex';
  resultsStrip.classList.add('visible');
  cardsRow.innerHTML = '';

  const mode     = formatSel.value;
  const sizeMode = sizeSel.value;
  const offset   = parseInt(offsetRange.value);
  const zoom     = parseInt(zoomRange.value) / 100;
  const template = nameInput.value.trim();

  let i = 0;

  function next() {
    if (i >= files.length) {
      stripTitle.textContent = 'Готово — ' + files.length + ' файлов';
      spinnerWrap.style.display = 'none';
      processBtn.disabled = false;
      processBtn.textContent = '⚙️ Обработать всё';
      return;
    }

    const file = files[i];
    const ext  = file.name.split('.').pop().toLowerCase();
    const outName = template
      ? template + '_' + (i+1) + '.' + ext
      : 'clean_' + file.name;

    const reader = new FileReader();
    reader.onerror = () => { i++; next(); };
    reader.onload = ev => {
      const img = new Image();
      img.onerror = () => { i++; next(); };
      img.onload = () => {
        try {
          const dataUrl = renderFull(img, mode, offset, zoom, sizeMode);
          addCard(dataUrl, outName, mode);
        } catch(e) { console.error(e); }
        i++;
        setTimeout(next, 8);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  next();
});

// ── Рендер финальный ──
function renderFull(img, mode, offset, zoom, sizeMode) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const ratio = mode === '4:3' ? 4/3 : 3/4;
  const [outW, outH] = getOutputSize(mode, sizeMode);

  const c1 = mk(W, H);
  c1.getContext('2d').drawImage(img, 0, 0);
  const px = c1.getContext('2d').getImageData(0, 0, W, H).data;
  const { top: et, bottom: eb } = smartCropEdges(px, W, H);
  const H2 = Math.max(1, eb - et);

  const c2 = mk(W, H2);
  c2.getContext('2d').drawImage(c1, 0, -et);

  const [cx, cy, cw, ch] = cropControl(W, H2, ratio, offset);
  const [zx, zy, zw, zh] = zoomCoords(cw, ch, zoom);

  const out = mk(outW, outH);
  out.getContext('2d').drawImage(c2, cx+zx, cy+zy, zw, zh, 0, 0, outW, outH);
  return out.toDataURL('image/jpeg', 0.93);
}

// ── Карточка результата ──
function addCard(dataUrl, name, mode) {
  const card = document.createElement('div');
  card.className = 'card';

  const img = document.createElement('img');
  img.src = dataUrl;
  img.className = 'card-img' + (mode === '3:4' ? ' portrait' : '');

  const foot = document.createElement('div');
  foot.className = 'card-foot';

  const nameEl = document.createElement('div');
  nameEl.className = 'card-name';
  nameEl.textContent = name;

  const dl = document.createElement('a');
  dl.className = 'card-dl';
  dl.textContent = '⬇ Скачать';
  dl.href = dataUrl;
  dl.download = name;

  foot.appendChild(nameEl);
  foot.appendChild(dl);
  card.appendChild(img);
  card.appendChild(foot);
  cardsRow.appendChild(card);
}

// ── Утилиты ──
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function smartCropEdges(data, w, h) {
  function isBg(i) {
    const v = (data[i] + data[i+1] + data[i+2]) / 3;
    return v < 30 || v > 235;
  }
  function ratio(y) {
    let n = 0;
    for (let x = 0; x < w; x++) n += isBg((y*w+x)*4) ? 1 : 0;
    return n / w;
  }
  let top = 0, bottom = h;
  for (let y = 0; y < h; y++)    { if (ratio(y) < 0.97) { top = y; break; } }
  for (let y = h-1; y >= 0; y--) { if (ratio(y) < 0.90) { bottom = y; break; } }
  if (bottom <= top) { top = 0; bottom = h; }
  return { top, bottom };
}

function cropControl(w, h, ratio, offset) {
  if (w / h > ratio) {
    const nw = Math.floor(h * ratio);
    return [Math.floor((w - nw) / 2), 0, nw, h];
  }
  const nh  = Math.floor(w / ratio);
  const ct  = Math.floor((h - nh) / 2);
  const sh  = Math.floor((offset - 200) * Math.max(0, h - nh) / 400);
  const top = Math.max(0, Math.min(h - nh, ct + sh));
  return [0, top, w, nh];
}

function zoomCoords(w, h, zoom) {
  if (zoom <= 1) return [0, 0, w, h];
  const nw = Math.floor(w / zoom), nh = Math.floor(h / zoom);
  return [Math.floor((w - nw) / 2), Math.floor((h - nh) / 2), nw, nh];
}

function getOutputSize(mode, sizeMode) {
  if (sizeMode === 'auto') return mode === '4:3' ? [1080, 810] : [810, 1080];
  const b = parseInt(sizeMode);
  return mode === '4:3' ? [1080, b] : [b, 1080];
}
